<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#17251b">
    <title>PULSE — Connexion impossible</title>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; background: #f2f0e7; color: #17251b; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 22px; }
      main { width: min(100%, 420px); text-align: center; }
      .mark { display: inline-grid; place-items: center; width: 76px; height: 76px; border-radius: 24px; background: #17251b; color: #f2f0e7; font-size: 42px; margin-bottom: 22px; }
      h1 { margin: 0; font-size: 42px; letter-spacing: -.05em; }
      h2 { margin: 28px 0 10px; font-size: 24px; }
      p { margin: 0 auto; max-width: 34ch; color: #536057; line-height: 1.55; }
      button { width: 100%; margin-top: 28px; padding: 16px 22px; border: 0; border-radius: 999px; background: #ed6b35; color: white; font: inherit; font-weight: 700; font-size: 16px; }
      small { display: block; margin-top: 18px; color: #768078; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1>PULSE</h1>
      <h2>Connexion impossible</h2>
      <p>L’application ne parvient pas à joindre PULSE. Vérifie ta connexion internet, puis réessaie dans quelques instants.</p>
      <button type="button" onclick="location.replace('https://pulsefood.fr')">Réessayer</button>
      <small>Les recettes reviendront dès que le service sera disponible.</small>
    </main>
  </body>
</html>
