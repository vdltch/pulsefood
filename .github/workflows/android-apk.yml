name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare package
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/PULSE-${GITHUB_REF_NAME:-development}.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: pulse-android-apk
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "PULSE Android ${{ github.ref_name }}"
          generate_release_notes: true
          prerelease: true
          files: dist/*
